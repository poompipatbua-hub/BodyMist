<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้า Body Scent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section section--tight section--cream">
      <div class="container">
        <h1>สั่งซื้อสินค้า</h1>
        <p class="mt-3">กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ รายการสินค้าและราคาจะถูกเติมให้อัตโนมัติจากสินค้าที่คุณเลือก</p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <form id="orderForm" class="form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div>
            <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>Body Scent</span>
      <span>&copy; 2026 Body Scent. สงวนลิขสิทธิ์</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
